<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website 3D Interaktif</title>
  
  <!-- File CSS Eksternal -->
  <link rel="stylesheet" href="style.css">

  <!-- Load Library Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Container khusus Canvas 3D -->
  <div id="webgl-container"></div>

  <!-- Overlay UI di bagian depan -->
  <div class="ui-overlay">
    <div class="ui-card">
      <h1>Pengalaman 3D</h1>
      <p>Klik dan geser mouse untuk memutar objek 3D. Gunakan scroll untuk memperbesar/memperkecil.</p>
      <button class="btn" id="interact-btn">Ubah Warna Material</button>
    </div>
  </div>

  <!-- File JavaScript Eksternal -->
  <script src="script.js"></script>
</body>
</html>
